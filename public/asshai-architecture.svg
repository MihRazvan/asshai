<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" width="1920" height="720">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist+Mono:wght@400;500&amp;display=swap');</style>
    <radialGradient id="bgArchOrange" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgArchPurple" cx="98%" cy="100%" r="40%">
      <stop offset="0%" stop-color="#624eff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#624eff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(247,244,235,0.022)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grid3Fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="8%" stop-color="#000" stop-opacity="1"/>
      <stop offset="92%" stop-color="#000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="grid3FadeMask">
      <rect width="1920" height="720" fill="url(#grid3Fade)"/>
    </mask>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,122,26,0.6)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(247,244,235,0.5)"/>
    </marker>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(63,185,127,0.6)"/>
    </marker>
  </defs>

  <rect width="1920" height="720" fill="#050607"/>
  <rect width="1920" height="720" fill="url(#grid3)" mask="url(#grid3FadeMask)"/>
  <rect width="1920" height="720" fill="url(#bgArchOrange)"/>
  <rect width="1920" height="720" fill="url(#bgArchPurple)"/>

  <g font-family="'Geist Mono', ui-monospace, monospace" font-size="13" letter-spacing="3">
    <text x="64" y="56" fill="rgba(247,244,235,0.18)">// $</text>
    <text x="1856" y="56" text-anchor="end" fill="rgba(247,244,235,0.18)">@()</text>
    <text x="64" y="688" fill="rgba(247,244,235,0.18)">&gt;&gt; ::</text>
    <text x="1856" y="688" text-anchor="end" fill="rgba(255,122,26,0.24)">{s}</text>
  </g>

  <!-- LANE HEADERS -->
  <g font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="3">
    <g transform="translate(80, 70)">
      <text font-size="11" fill="rgba(247,244,235,0.45)" letter-spacing="4">ARBITRUM</text>
      <text y="22" font-size="13" fill="#f7f4eb">SOURCE</text>
      <line x1="0" y1="34" x2="360" y2="34" stroke="rgba(247,244,235,0.1)"/>
    </g>
    <g transform="translate(540, 70)">
      <text font-size="11" fill="rgba(255,122,26,0.88)" letter-spacing="4">SOMNIA</text>
      <text y="22" font-size="13" fill="#f7f4eb">COMPILE · VALIDATOR CONSENSUS</text>
      <line x1="0" y1="34" x2="820" y2="34" stroke="rgba(255,122,26,0.2)"/>
    </g>
    <g transform="translate(1520, 70)">
      <text font-size="11" fill="rgba(247,244,235,0.45)" letter-spacing="4">BASE</text>
      <text y="22" font-size="13" fill="#f7f4eb">EXECUTE · LI.FI</text>
      <line x1="0" y1="34" x2="320" y2="34" stroke="rgba(247,244,235,0.1)"/>
    </g>
  </g>

  <!-- ARBITRUM LANE -->
  <g transform="translate(80, 140)">
    <rect width="360" height="76" rx="10" fill="rgba(247,244,235,0.035)" stroke="rgba(247,244,235,0.1)"/>
    <text x="20" y="26" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(247,244,235,0.4)">USER WALLET</text>
    <text x="20" y="54" font-family="'Instrument Serif', Georgia, serif" font-size="22" fill="#f7f4eb">1 USDC source</text>

    <g transform="translate(0, 100)">
      <rect width="360" height="120" rx="10" fill="rgba(247,244,235,0.025)" stroke="rgba(247,244,235,0.08)"/>
      <text x="20" y="26" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(247,244,235,0.4)">NATURAL LANGUAGE GOAL</text>
      <text x="20" y="60" font-family="'Instrument Serif', Georgia, serif" font-size="18" font-style="italic" fill="rgba(247,244,235,0.9)">"safest USDC yield,</text>
      <text x="20" y="84" font-family="'Instrument Serif', Georgia, serif" font-size="18" font-style="italic" fill="rgba(247,244,235,0.9)">no lockup"</text>
      <text x="20" y="108" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(247,244,235,0.45)">→ GoalRegistry.postGoal()</text>
    </g>
  </g>

  <!-- Arrow Arbitrum → Somnia -->
  <g>
    <line x1="446" y1="178" x2="534" y2="178" stroke="rgba(247,244,235,0.5)" stroke-width="1.5" marker-end="url(#arrB)"/>
    <text x="490" y="168" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(247,244,235,0.55)">post goal</text>
  </g>

  <!-- SOMNIA LANE -->
  <g transform="translate(540, 140)">
    <g>
      <rect width="540" height="58" rx="10" fill="rgba(247,244,235,0.035)" stroke="rgba(247,244,235,0.1)"/>
      <text x="20" y="24" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(247,244,235,0.42)">GOALREGISTRY · contract</text>
      <text x="20" y="44" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#f7f4eb">stores goal · emits GoalPosted · triggers CompilerEngine</text>
    </g>

    <line x1="270" y1="58" x2="270" y2="84" stroke="rgba(255,122,26,0.6)" stroke-width="1.5" marker-end="url(#arrA)"/>

    <g transform="translate(0, 94)">
      <rect width="540" height="248" rx="10" fill="rgba(255,122,26,0.04)" stroke="rgba(255,122,26,0.24)"/>
      <text x="20" y="26" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(255,122,26,0.88)">COMPILERENGINE · orchestrator</text>

      <g transform="translate(20, 44)">
        <rect width="500" height="80" rx="8" fill="rgba(247,244,235,0.04)" stroke="rgba(247,244,235,0.12)"/>
        <text x="14" y="22" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="2" fill="rgba(247,244,235,0.5)">JSON API AGENT · validator consensus 3/3</text>
        <text x="14" y="46" font-family="'Instrument Serif', Georgia, serif" font-size="18" fill="#f7f4eb">fetch verified venue rates</text>
        <text x="14" y="66" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(247,244,235,0.55)">defillama → apy · tvl · risk · lockup</text>
      </g>

      <line x1="270" y1="132" x2="270" y2="150" stroke="rgba(255,122,26,0.6)" stroke-width="1.5" marker-end="url(#arrA)"/>

      <g transform="translate(20, 158)">
        <rect width="500" height="80" rx="8" fill="rgba(247,244,235,0.04)" stroke="rgba(247,244,235,0.12)"/>
        <text x="14" y="22" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="2" fill="rgba(247,244,235,0.5)">LLM AGENT · validator consensus 3/3</text>
        <text x="14" y="46" font-family="'Instrument Serif', Georgia, serif" font-size="18" fill="#f7f4eb">choose one allowlisted venue</text>
        <text x="14" y="66" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(247,244,235,0.55)">returns {poolId, objective, rejected[], reasoning}</text>
      </g>
    </g>

    <line x1="270" y1="342" x2="270" y2="368" stroke="rgba(255,122,26,0.6)" stroke-width="1.5" marker-end="url(#arrA)"/>

    <g transform="translate(0, 378)">
      <rect width="540" height="58" rx="10" fill="rgba(247,244,235,0.035)" stroke="rgba(247,244,235,0.1)"/>
      <text x="20" y="24" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(247,244,235,0.42)">ADDRESSREGISTRY · contract</text>
      <text x="20" y="44" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#f7f4eb">Solidity validates poolId against on-chain allowlist</text>
    </g>

    <line x1="270" y1="436" x2="270" y2="462" stroke="rgba(255,122,26,0.6)" stroke-width="1.5" marker-end="url(#arrA)"/>

    <g transform="translate(0, 472)">
      <rect width="540" height="58" rx="10" fill="rgba(247,244,235,0.035)" stroke="rgba(247,244,235,0.1)"/>
      <text x="20" y="24" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(247,244,235,0.42)">STANDARDORDERENCODER · contract</text>
      <text x="20" y="44" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#f7f4eb">build ERC-7683 StandardOrder bytes</text>
    </g>
  </g>

  <!-- RECEIPTLOG RAIL -->
  <g transform="translate(1120, 140)">
    <rect width="360" height="530" rx="10" fill="rgba(63,185,127,0.04)" stroke="rgba(63,185,127,0.22)" stroke-dasharray="5 3"/>
    <text x="20" y="28" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(165,226,195,0.9)">RECEIPTLOG · contract</text>
    <text x="20" y="58" font-family="'Instrument Serif', Georgia, serif" font-size="22" fill="#a5e2c3">5 on-chain receipts</text>
    <text x="20" y="82" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(247,244,235,0.5)">every compile step is verifiable</text>

    <g transform="translate(20, 124)" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="rgba(247,244,235,0.78)">
      <g>
        <rect x="-6" y="-14" width="320" height="32" rx="6" fill="rgba(63,185,127,0.04)" stroke="rgba(63,185,127,0.16)"/>
        <circle cx="6" cy="2" r="3" fill="#3fb97f"/>
        <text x="20" y="6">1. rates_fetched</text>
      </g>
      <g transform="translate(0, 48)">
        <rect x="-6" y="-14" width="320" height="32" rx="6" fill="rgba(63,185,127,0.04)" stroke="rgba(63,185,127,0.16)"/>
        <circle cx="6" cy="2" r="3" fill="#3fb97f"/>
        <text x="20" y="6">2. decision_built</text>
      </g>
      <g transform="translate(0, 96)">
        <rect x="-6" y="-14" width="320" height="32" rx="6" fill="rgba(63,185,127,0.04)" stroke="rgba(63,185,127,0.16)"/>
        <circle cx="6" cy="2" r="3" fill="#3fb97f"/>
        <text x="20" y="6">3. candidates_selected</text>
      </g>
      <g transform="translate(0, 144)">
        <rect x="-6" y="-14" width="320" height="32" rx="6" fill="rgba(63,185,127,0.04)" stroke="rgba(63,185,127,0.16)"/>
        <circle cx="6" cy="2" r="3" fill="#3fb97f"/>
        <text x="20" y="6">4. plan_built</text>
      </g>
      <g transform="translate(0, 192)">
        <rect x="-6" y="-14" width="320" height="32" rx="6" fill="rgba(63,185,127,0.04)" stroke="rgba(63,185,127,0.16)"/>
        <circle cx="6" cy="2" r="3" fill="#3fb97f"/>
        <text x="20" y="6">5. order_encoded</text>
      </g>
    </g>

    <text x="20" y="450" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(247,244,235,0.42)">Each entry includes step,</text>
    <text x="20" y="466" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(247,244,235,0.42)">payload, timestamp,</text>
    <text x="20" y="482" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(247,244,235,0.42)">and agent request id.</text>
    <text x="20" y="508" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(255,122,26,0.75)">→ shannon-explorer.somnia.network</text>
  </g>

  <g stroke="rgba(63,185,127,0.18)" stroke-width="1" stroke-dasharray="3 4" fill="none">
    <path d="M 1080 282 L 1120 282"/>
  </g>

  <!-- Arrow Somnia → Base -->
  <g>
    <path d="M 1080 644 L 1490 644 L 1490 182 L 1516 182" stroke="rgba(247,244,235,0.5)" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
    <text x="1495" y="630" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="rgba(247,244,235,0.55)">encoded route → frontend</text>
  </g>

  <!-- BASE LANE -->
  <g transform="translate(1520, 140)">
    <rect width="320" height="74" rx="10" fill="rgba(247,244,235,0.035)" stroke="rgba(247,244,235,0.1)"/>
    <text x="20" y="26" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(247,244,235,0.42)">LI.FI COMPOSER</text>
    <text x="20" y="54" font-family="'Instrument Serif', Georgia, serif" font-size="20" fill="#f7f4eb">quote + execute</text>

    <line x1="160" y1="74" x2="160" y2="98" stroke="rgba(63,185,127,0.6)" stroke-width="1.5" marker-end="url(#arrC)"/>

    <g transform="translate(0, 108)">
      <rect width="320" height="74" rx="10" fill="rgba(247,244,235,0.025)" stroke="rgba(247,244,235,0.08)"/>
      <text x="20" y="26" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(247,244,235,0.42)">CROSS-CHAIN BRIDGE</text>
      <text x="20" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#f7f4eb">arb USDC → base USDC</text>
    </g>

    <line x1="160" y1="182" x2="160" y2="206" stroke="rgba(63,185,127,0.6)" stroke-width="1.5" marker-end="url(#arrC)"/>

    <g transform="translate(0, 216)">
      <rect width="320" height="74" rx="10" fill="rgba(247,244,235,0.025)" stroke="rgba(247,244,235,0.08)"/>
      <text x="20" y="26" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(247,244,235,0.42)">DESTINATION SUPPLY</text>
      <text x="20" y="54" font-family="'Geist Mono', ui-monospace, monospace" font-size="13" fill="#f7f4eb">supply to chosen venue</text>
    </g>

    <line x1="160" y1="290" x2="160" y2="314" stroke="rgba(63,185,127,0.6)" stroke-width="1.5" marker-end="url(#arrC)"/>

    <g transform="translate(0, 324)">
      <rect width="320" height="92" rx="10" fill="rgba(63,185,127,0.07)" stroke="rgba(63,185,127,0.32)"/>
      <text x="20" y="26" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" letter-spacing="3" fill="rgba(165,226,195,0.9)">POSITION ACQUIRED</text>
      <text x="20" y="58" font-family="'Instrument Serif', Georgia, serif" font-size="26" fill="#a5e2c3">aBasUSDC</text>
      <text x="20" y="80" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" fill="rgba(165,226,195,0.72)">non-custodial · auditable</text>
    </g>
  </g>

  <!-- Bottom strap -->
  <g transform="translate(960, 700)" text-anchor="middle">
    <text font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing="2" fill="rgba(247,244,235,0.45)">
      LLM cannot invent contracts &nbsp; · &nbsp; Solidity enforces allowlist &nbsp; · &nbsp; receipts auditable on Somnia &nbsp; · &nbsp; execution non-custodial
    </text>
  </g>
</svg>
