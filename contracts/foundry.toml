[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# Somnia testnet: chain ID 50312
# Platform contract: 0x037Bb9C718F3f7fe5eCBDB0b600D607b52706776
# Current docs RPC is api.infra.testnet; dream-rpc still answers chain ID 50312.
somnia_testnet = "${SOMNIA_TESTNET_RPC}"
somnia_testnet_current = "https://api.infra.testnet.somnia.network/"
somnia_testnet_dream = "https://dream-rpc.somnia.network"
base = "${BASE_RPC}"

[etherscan]
somnia_testnet = { key = "${SOMNIA_ETHERSCAN_API_KEY}", url = "https://shannon-explorer.somnia.network/api" }
